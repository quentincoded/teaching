<script>
/* Boot: theme + language before first paint, unfold-transition flag, JS failsafe */
(function(){var d=document.documentElement;d.classList.add('js');var t,l;
try{t=localStorage.getItem('theme');l=localStorage.getItem('lang')}catch(e){}
d.dataset.theme=t==='dark'||((!t||t==='system')&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
d.lang=l==='en'||l==='de'?l:((navigator.language||'de').slice(0,2).toLowerCase()==='en'?'en':'de');
try{var x=sessionStorage.getItem('tx');if(x){var o=JSON.parse(x);if(Date.now()-o.t<8000){d.classList.add('tx-enter');d.style.setProperty('--tx-color',o.color)}else sessionStorage.removeItem('tx')}}catch(e){}
setTimeout(function(){if(!d.classList.contains('ready')){d.classList.remove('js','tx-enter')}},4000)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="about" data-title-key="about.title">

<main id="main">

  <section class="hero hero--compact container">
    <div class="about-hero">
      <div style="display:grid;gap:22px">
        <span class="eyebrow" data-i18n="about.eyebrow">Über mich</span>
        <h1 class="hero__title" data-split data-i18n-html="about.hi">Hoi, ich bin Quentin.</h1>
        <p class="pill" data-reveal style="--d:.4s;justify-self:start"><span class="dot dot--live"></span><span id="role"></span></p>
        <p class="bio" id="bio" data-reveal style="--d:.5s"></p>
        <div class="link-row" data-reveal style="--d:.6s"><a class="btn" href="#contact"><span data-i18n="about.contact.title">Schreib mir.</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a></div>
      </div>
      <div class="portrait" data-reveal="scale" style="--d:.3s">
        <div class="portrait__ring"></div>
        <div class="portrait__img"><img id="portrait" src="images/portrait.jpg" alt="Portrait von Quentin Türler" width="1000" height="1000"></div>
        <span class="portrait__orb portrait__orb--a"></span>
        <span class="portrait__orb portrait__orb--b"></span>
      </div>
    </div>
  </section>
  <section class="section container">
    <div class="section-head">
      <span class="eyebrow" data-i18n="about.teaching.eyebrow">Lehrtätigkeit</span>
      <h2 data-split data-i18n-html="about.teaching.title">Was ich unterrichtet habe.</h2>
    </div>
    <div class="teach-list" id="teaching"></div>
  </section>
  <section class="section container" id="contact" style="padding-top:0">
    <div class="section-head">
      <span class="eyebrow" data-i18n="about.contact.eyebrow">Kontakt</span>
      <h2 data-split data-i18n-html="about.contact.title">Schreib mir.</h2>
      <p data-reveal data-i18n="about.contact.lead"></p>
    </div>
    <div class="contact-grid" id="contacts"></div>
    <div class="callout grain" id="feedback" data-reveal="scale" style="margin-top:clamp(16px,3vw,28px)"></div>
  </section>
  <noscript><p class="container" style="padding:140px 0 40px">Diese Seite braucht JavaScript. / This page needs JavaScript.</p></noscript>
</main>
